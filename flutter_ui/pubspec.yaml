name: flutter_ui
description: "Omnispex: Warhammer 40,000 & Kill Team Companion (Mathematics, Catalogues, Army Builder, Match Tracker & Wishlist)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_rust_bridge: 2.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  ffi: ^2.1.0
  path_provider: ^2.1.0
  web: ^0.5.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/wh40k_11e_bundle.json
