name: Omnispex Unified CD Pipeline

on:
  push:
    branches:
      - rewrite
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish / update'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write
  packages: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verification (Architecture, Rust, Cloud Worker & Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify wh40k does not reference kill_team
        run: |
          echo "Checking wh40k module isolation..."
          if grep -rni "kill_team" crates/omnispex_core/src/wh40k/; then
            echo "::error::Strict zero-coupling violation: crates/omnispex_core/src/wh40k references kill_team!"
            exit 1
          fi

      - name: Verify kill_team does not reference wh40k
        run: |
          echo "Checking kill_team module isolation..."
          if grep -rni "wh40k" crates/omnispex_core/src/kill_team/; then
            echo "::error::Strict zero-coupling violation: crates/omnispex_core/src/kill_team references wh40k!"
            exit 1
          fi

      - name: Verify flutter_ui/lib/features/kill_team has zero imports from 40k
        run: |
          echo "Checking Flutter Kill Team UI module isolation..."
          if grep -rEn "screens/(in_battle|list_building|army_list|unit_browser)|services/(bsdata|simulation)|models/(bsdata|simulation)" flutter_ui/lib/features/kill_team/; then
            echo "::error::Strict zero-coupling violation: flutter_ui/lib/features/kill_team imports 40k screens/services/models!"
            exit 1
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/cloud-worker/package-lock.json

      - name: Run Cloud Worker Tests
        working-directory: services/cloud-worker
        run: |
          npm ci
          npm test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Release omnispex_flutter Shared Library
        run: |
          cargo build --release -p omnispex_flutter
          mkdir -p flutter_ui/target/release
          cp target/release/libomnispex_flutter.so flutter_ui/
          cp target/release/libomnispex_flutter.so flutter_ui/target/release/

      - name: Flutter Pub Get
        working-directory: flutter_ui
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: flutter_ui
        run: flutter analyze

      - name: Flutter Tests with Rust FFI Engine
        working-directory: flutter_ui
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/flutter_ui:${{ github.workspace }}/target/release
        run: flutter test

  deploy-worker-and-web:
    name: Deploy Cloudflare Worker & Flutter Website
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (with wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/cloud-worker/package-lock.json

      - name: Compile Rust WebAssembly Module
        run: |
          cargo build --target wasm32-unknown-unknown --release -p omnispex_flutter
          cp target/wasm32-unknown-unknown/release/omnispex_flutter.wasm flutter_ui/web/omnispex_flutter.wasm

      - name: Build Flutter Web Bundle
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter build web --release --base-href /

      - name: Deploy Cloudflare Worker & Web Assets to workers.dev
        working-directory: services/cloud-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npx wrangler deploy

  build-android:
    name: Build Signed Android Release APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust Toolchain for Android NDK
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile Rust JNI Libraries
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o flutter_ui/android/app/src/main/jniLibs build --release -p omnispex_flutter

      - name: Configure Android Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PROPS" ]; then
            echo "Installing release keystore from repository secrets..."
            echo "$KEYSTORE_B64" | base64 -d > flutter_ui/android/app/omnispex-release.jks
            echo "$KEY_PROPS" > flutter_ui/android/key.properties
          else
            echo "Warning: Release signing secrets not set, falling back to debug signing config."
          fi

      - name: Build Android Release APK
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Stage Release APK Artifacts
        run: |
          mkdir -p release-apks
          if [ -f flutter_ui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp flutter_ui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/omnispex-android-arm64-v8a.apk
          fi
          if [ -f flutter_ui/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp flutter_ui/build/app/outputs/flutter-apk/app-release.apk release-apks/omnispex-android-universal.apk
            cp flutter_ui/build/app/outputs/flutter-apk/app-release.apk release-apks/omnispex-android-release.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: release-apks/*

  publish-github-release:
    name: Publish GitHub Release with APK
    needs: [deploy-worker-and-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: release-assets/

      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.2.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Omnispex ${{ steps.release-tag.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
          body: |
            ## Omnispex Tactical Companion — Release ${{ steps.release-tag.outputs.tag }}

            Omnispex is a high-performance Warhammer 40,000 (11th Edition) & Kill Team companion engine.

            ### Downloads & Deployment
            - 🌐 **Web Live App**: Hosted on Cloudflare Edge: [https://omnispex-cloud.kamilsuhak.workers.dev](https://omnispex-cloud.kamilsuhak.workers.dev)
            - 📱 **Android Universal APK**: Download `omnispex-android-universal.apk` (or `omnispex-android-release.apk`) attached below.
            - 📱 **Android ARM64 APK**: Download `omnispex-android-arm64-v8a.apk` for 64-bit ARM mobile devices.
            - ⚡ **Cloudflare Worker API**: Deployed to `https://omnispex-cloud.kamilsuhak.workers.dev/api` with key-based authentication (`Authorization: Bearer <key>`) and D1 persistence.

            ### Key Architectural Capabilities
            - **Strict Game Isolation**: Warhammer 40,000 and Kill Team engines and UI features operate with zero cross-system coupling.
            - **Stateful Rust Memory Engine**: Process-wide indexed catalogue lookup and analytical probability calculation.
            - **11th Edition 40K & 3rd Edition Kill Team Parity**: 1:1 shooting pipelines, wound allocation, Kill Team alternating Strike/Parry melee duel resolution, and Chapter Approved roster validation.
            - **Key-Based Multi-User Cloud Sync**: Single unique cryptographic access key per client without passwords or accounts.
